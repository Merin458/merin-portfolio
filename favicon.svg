<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#12182b"/>
    </linearGradient>
    <linearGradient id="bracketGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bracketGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container badge with subtle dual-tone border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>

  <!-- Logo text <MpE> -->
  <g filter="url(#glow)">
    <text x="32" y="39" 
          font-family="'Space Grotesk', 'Fira Code', 'Courier New', monospace" 
          font-size="16" 
          font-weight="800" 
          letter-spacing="-0.04em"
          text-anchor="middle">
      <tspan fill="url(#bracketGrad1)">&lt;</tspan>
      <tspan fill="url(#textGrad)">MpE</tspan>
      <tspan fill="url(#bracketGrad2)">&gt;</tspan>
    </text>
  </g>

  <!-- Subtle Python node dots -->
  <circle cx="21" cy="48" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="43" cy="16" r="1.5" fill="#818cf8" opacity="0.8"/>
</svg>
